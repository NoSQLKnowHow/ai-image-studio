  <title>AI Image Studio laser test sheet</title>
  <desc>DESIGN.md section 31.9. 100 x 100 mm, one unit is one millimetre. Four layers in four exact colours; each holds a filled square, an outline square, a ring (a filled circle with a hole), an outline circle and a 10 x 2 mm scale bar. Layer 1 also has an outline frame of the whole sheet.</desc>
